        card('💡', 'Common mistake', `<p>"I'll stand on 16 vs 10 because I might bust." Standing on 16 against a 10 wins less than hitting. You're the underdog either way, so make the play that loses least.</p>`, 'tip'),
        `<div class="lesson-card wide"><h3><span class="ico">▦</span>The chart rows</h3>${chart('hard', [17, 16, 15, 14, 13, 12])}</div>`,
      ],
    },
    {
      id: 'hard-double',
      title: 'Hard Totals: When to Double',
      tag: 'Hard 8–11',
      blurb: 'Put more money out when you are the favourite.',
      quiz: { filter: 'hard-double', count: 12, threeCard: true },
      lesson: () => [
        card('✌️', 'Why double?', `<p>When you're likely to win, you want more money on the table. Doubling doubles your bet, and you get <b>exactly one card</b>.</p>`),
        card('1️⃣', '11: always double', `<p>Double 11 against <b>every</b> upcard, even an Ace. It's the best doubling hand in the game.</p>${handEq(['6♠', '5♥'], '11')}`),
        card('🔟', '10: double vs 2 to 9', `<p>Double against 2 to 9. Against a <b>10 or Ace</b>, just hit. The dealer's card is as strong as yours.</p>`),
        card('9️⃣', '9: double vs 3 to 6', `<p>Double 9 only against the weak cards <b>3 to 6</b>. Hit against 2 and against 7 to Ace.</p>`),
        card('📏', 'The "D" code', `<p><b class="hl-g">D</b> means <i>double if allowed, otherwise hit</i>. You can only double on your <b>first two cards</b>, so a 3-card 11 is just a hit.</p>${handEq(['2♣', '4♦', '5♠'], '11 → Hit')}`, 'tip'),
        `<div class="lesson-card wide"><h3><span class="ico">▦</span>The chart rows</h3>${chart('hard', [11, 10, 9, 8])}</div>`,
      ],
    },
    {
      id: 'soft',
      title: 'Soft Totals',
      tag: 'A,2 – A,9',
      blurb: "Hands with an Ace counted as 11. They can't bust, so you can be aggressive.",
      quiz: { filter: 'soft', count: 15, threeCard: true },
      lesson: () => [
        card('🛡️', "Why soft hands are special", `<p>A soft hand <b>can't bust with one card</b>. That makes it perfect for doubling against a weak dealer.</p>`),
        card('🏆', 'Soft 19 and 20: stand', `<p>A,9 always stands. A,8 stands too, <b>except vs 6</b>: <span class="hl-t">Ds</span>, double if you can, otherwise stand.</p>`),
        card('🎢', 'Soft 18 (A,7): the tricky one', `<ul><li>vs <span class="hl-g">2 to 6</span>: <b class="hl-t">Ds</b>, double, or stand if you can't</li><li>vs <b>7 or 8</b>: <b class="hl-y">stand</b></li><li>vs <b>9, 10, A</b>: <b>HIT</b>. 18 is an underdog here</li></ul>`),
        card('🚫', 'Soft 17 (A,6)', `<p>Double vs <b>3 to 6</b>, otherwise hit. <b>Never stand on soft 17.</b></p>`),
        card('🪜', 'The doubling window grows', `<ul><li>A,2 and A,3: double vs <b>5–6</b></li><li>A,4 and A,5: double vs <b>4–6</b></li><li>A,6: double vs <b>3–6</b></li><li>A,7: double vs <b>2–6</b></li></ul><p class="muted">Otherwise hit, except A,7, which stands vs 7–8.</p>`, 'tip'),
        card('📏', 'D vs Ds', `<p><b class="hl-g">D</b>: double, otherwise <b>hit</b>. <b class="hl-t">Ds</b>: double, otherwise <b>stand</b>.</p><p>A 3-card soft 18 vs 4 can't double, so it stands.</p>${handEq(['A♣', '3♦', '4♠'], 'Soft 18')}`),
        `<div class="lesson-card wide"><h3><span class="ico">▦</span>The chart</h3>${chart('soft')}</div>`,
      ],
    },
    {
      id: 'pairs',
      title: 'Pair Splitting',
      tag: 'Pairs',
      blurb: 'When to turn one hand into two.',
      quiz: { filter: 'pairs', count: 15 },
      lesson: () => [
        card('✅', 'Always split', `<p><b>A,A</b> and <b>8,8</b>, against everything.</p>${cards(['A♠', 'A♥'])}${cards(['8♣', '8♦'])}<p class="muted">16 is the worst hand in blackjack. Two hands starting with 8 lose far less.</p>`),
        card('⛔', 'Never split', `<p><b>10,10</b>: you already have 20.<br><b>5,5</b>: play it as hard 10 and double vs 2–9.</p>${cards(['K♠', 'Q♥'])}`),
        card('9️⃣', '9,9', `<p>Split vs <b>2–6, 8, 9</b>. <b class="hl-y">Stand</b> vs <b>7</b> (your 18 beats the dealer's likely 17), and vs <b>10 and A</b>.</p>`),
        card('7️⃣', '7,7 and 6,6', `<p><b>7,7</b>: split vs 2–7.<br><b>6,6</b>: split vs 3–6, and vs 2 only with DAS.</p>`),
        card('🔢', '2,2 · 3,3 · 4,4', `<p><b>2,2 and 3,3</b>: split vs 4–7, and vs 2–3 only with DAS.<br><b>4,4</b>: split only vs 5–6 with DAS.</p>`),
        card('📏', 'What Y/N means', `<p><b class="hl-t">Y/N</b> = split only if the casino lets you <b>double after splitting</b> (DAS). This table allows DAS, so Y/N means split. Turn DAS off in Drill to practise the other version.</p>`, 'tip'),
        `<div class="lesson-card wide"><h3><span class="ico">▦</span>The chart</h3>${chart('pairs')}</div>`,
      ],
    },
    {
      id: 'tough',
      title: 'Insurance & Tough Hands',
      tag: 'Tricky spots',
      blurb: 'The hands players get wrong most, and the side bet to always refuse.',
      quiz: { filter: 'tough', count: 12 },
      lesson: () => [
        card('🛑', 'Never take insurance', `<p>Insurance pays 2:1 if the dealer's hole card is a 10. Only 4 of 13 cards are 10-value, so you lose that bet 9 times in 13. That's about <b>−7.7%</b> per insurance bet. "Even money" on your blackjack is the same bet in disguise.</p>`),
        card('🪨', '16 vs 9, 10, A: hit', `<p>There's no surrender at European tables, so you play the worst hands out. <b>Hard 16</b> against <b>9, 10 or Ace</b>, and <b>hard 15</b> against <b>10</b>: hit. You're the underdog either way, but hitting loses less than standing.</p>`),
        card('8️⃣', 'Split 8s, even vs 10 and A', `<p>8,8 makes 16, the worst total in the game. Two hands that start with 8 lose far less, so split them against every upcard.</p>${cards(['8♠', '8♥'])}`),
        card('🎢', 'Soft 18 vs 9, 10, A: hit', `<p>The most-missed hand in blackjack. 18 feels safe, but it's an underdog against a 9, 10 or Ace, and a soft hand can't bust with one more card.</p>${handEq(['A♣', '7♦'], 'Soft 18')}`),
        card('⚠️', '12 vs 2 and 3: hit', `<p>Only 4, 5 and 6 are weak enough to stand on 12. Against a 2 or 3, take a card.</p>`),
        card('🧭', 'The order of decisions', `<ol><li><b>Pair?</b> Check the splitting table first</li><li><b>Double?</b> Only on your first two cards</li><li><b>Otherwise</b> hit or stand</li></ol>`, 'tip'),
        `<div class="lesson-card wide"><h3><span class="ico">▦</span>The chart rows</h3>${chart('hard', [16, 15, 12])}${chart('soft', [18])}</div>`,
      ],
    },
    {
      id: 'exam',
      title: 'Final Exam',
      tag: 'Everything',
      blurb: '30 hands from the whole chart, including 3-card hands. Score 90% to master it.',
      quiz: { filter: 'all', count: 30, threeCard: true, pass: 0.9 },
      lesson: () => [
        card('🎓', 'Everything at once', `<p>30 hands from every part of the chart, including 3-card hands where you can't double or split.</p><p>Remember the order: <b>split → double → hit/stand</b>.</p>`),
        card('⭐', 'Scoring', `<ul><li>★ 80%+</li><li>★★ 90%+</li><li>★★★ a perfect 30/30</li></ul>`),
        card('🃏', 'Then take a seat', `<p>Once you pass, take what you learned to the <b>Table</b> and play real rounds with the coach on.</p>`, 'tip'),
      ],
    },
  ];

  const starsFor = (acc) => (acc >= 1 ? 3 : acc >= 0.9 ? 2 : acc >= 0.8 ? 1 : 0);

  // ---------- Totals quiz (Level 1) ----------
  class TotalsQuiz {
    constructor(root, cfg) {
      this.root = root;
      this.cfg = cfg;
      this.n = 0;
      this.correct = 0;
      this.misses = [];
    }
    start() {
      this.next();
    }
    makeHand() {
      for (;;) {
        const len = BJ.pick([2, 2, 3, 3, 4]);
        const hasAce = Math.random() < 0.6;
        const cs = [];
        if (hasAce) cs.push(BJ.cardOfValue(1));
        while (cs.length < len) cs.push(BJ.cardOfValue(1 + BJ.rand(10)));
        const h = BJ.handInfo(cs);
        if (h.total <= 21 && h.total >= 5) return cs;
      }
    }
    next() {
      if (this.n >= this.cfg.count) return this.cfg.onFinish({ n: this.n, correct: this.correct, acc: this.correct / this.n, misses: [] });
      const cs = this.makeHand();
      const h = BJ.handInfo(cs);
      const hasAce = cs.some((c) => c.v === 1);
      const label = (t, s) => (s ? `Soft ${t}` : `Hard ${t}`);
      const right = h.blackjack ? 'Blackjack' : label(h.total, h.soft);
      const cand = [];
      if (h.blackjack) cand.push('Hard 11', 'Hard 21', 'Soft 11');
      else if (h.soft) cand.push(label(h.total - 10, false), label(h.total, false));
      else if (hasAce) cand.push(label(h.total, true), 'Bust');
      cand.push(label(h.total, !h.soft), label(h.total + 1, h.soft), label(h.total - 1, h.soft), label(h.total + 2, false));
      const opts = new Set([right]);
      for (const c of cand) {
        if (opts.size >= 4) break;
        const t = Number(c.split(' ')[1]);
        if (c === 'Bust' || (t >= 2 && t <= 21)) opts.add(c);
      }
      for (let k = 3; opts.size < 4; k++) opts.add(label(Math.max(2, h.total - k), false));
      const list = Array.from(opts);
      for (let i = list.length - 1; i > 0; i--) {
        const j = BJ.rand(i + 1);
        [list[i], list[j]] = [list[j], list[i]];
      }
      this.root.innerHTML = `<div class="trainer">
        <div class="trainer-bar"><div class="stat-row"><span class="stat-pill">Hand <b>${this.n + 1}</b>/${this.cfg.count}</span><span class="stat-pill">Correct <b>${this.correct}</b></span></div><button class="btn sm ghost" data-r="exit">Back to lesson</button></div>
        <div class="progress"><span style="width:${(this.n / this.cfg.count) * 100}%"></span></div>
        <div class="felt" style="display:grid;place-items:center;min-height:220px"><div class="seat"><div class="seat-label">What is this hand?</div><div class="hand">${handHTML(cs, { animate: true, stagger: 70 })}</div></div></div>
        <div class="choice-grid">${list.map((o) => `<button class="choice" data-o="${o}">${o}</button>`).join('')}</div>
        <div data-r="fb"></div></div>`;
      this.root.querySelector('[data-r="exit"]').onclick = () => this.cfg.onExit();
      this.answered = false;
      this.root.querySelector('.choice-grid').onclick = (e) => {
        const b = e.target.closest('.choice');
        if (!b || this.answered) return;
        this.answered = true;
        const ok = b.dataset.o === right;
        this.n++;
        if (ok) this.correct++;
        BJ.UI.$$('.choice', this.root).forEach((x) => {
          x.disabled = true;
          if (x.dataset.o === right) x.classList.add('right');
          else if (x === b) x.classList.add('wrong');
        });
        const why = h.soft
          ? `The Ace counts as 11 without busting, so this is soft ${h.total}. It can't bust with one more card.`
          : cs.some((c) => c.v === 1)
            ? `Counting the Ace as 11 would make ${h.total + 10} and bust, so it counts as 1: hard ${h.total}.`
            : `No Ace, so it's a hard total: ${cs.map((c) => c.v).join(' + ')} = ${h.total}.`;
        this.root.querySelector('[data-r="fb"]').innerHTML = `<div class="feedback ${ok ? '' : 'bad'}"><div class="fb-head"><div class="fb-icon">${ok ? '✓' : '✕'}</div><div><div class="fb-title">${h.blackjack ? 'Blackjack! Ace + 10-value on two cards.' : right}</div><div class="fb-sub">${h.blackjack ? 'Pays 3:2' : why}</div></div></div><div class="fb-foot"><span></span><button class="btn primary" data-r="next">Next<kbd>Enter</kbd></button></div></div>`;
        this.root.querySelector('[data-r="next"]').onclick = () => this.next();
      };
    }
    onKey(e) {
      if (this.answered && (e.key === 'Enter' || e.key === ' ')) {
        e.preventDefault();
        this.next();
      } else if (!this.answered && /^[1-4]$/.test(e.key)) {
        const b = BJ.UI.$$('.choice', this.root)[+e.key - 1];
        if (b) b.click();
      }
    }
    destroy() {}
  }

  // ---------- View ----------
  const LearnView = {
    init(root) {
      this.root = root;
      this.active = null;
    },
    onShow(params) {
      if (params && params.level) this.openLesson(params.level);
      else if (!this.active) this.renderList();
    },
    onHide() {},
    progress() {
      return BJ.Stats.data.levels;
    },
    renderList() {
      this.stopQuiz();
      this.active = null;
      const prog = this.progress();
      const passed = LEVELS.filter((l) => (prog[l.id] || {}).stars >= 1).length;
      const nextLevel = LEVELS.find((l) => !((prog[l.id] || {}).stars >= 1));
      const d = BJ.Stats.data;
      const acc = d.total.n ? Math.round((d.total.c / d.total.n) * 100) + '%' : '—';
      this.root.innerHTML = `
        <div class="learn-hero">
          <div class="hero-card">
            <div class="eyebrow" style="color:#7ff0c3">Blackjack Strategy Trainer</div>
            <h1>Learn to play every hand perfectly.</h1>
            <p>Perfect basic strategy cuts the casino's edge to about 0.5%. Learn the chart one section at a time, drill it until it's automatic, then play real rounds with a coach watching every decision.</p>
            <button class="btn primary lg" id="continue">${nextLevel ? (passed ? 'Continue: ' : 'Start: ') + nextLevel.title : 'Practise weak spots'} →</button>
            <div class="hero-cards">${BJ.cardHTML(mk('A♠'))}${BJ.cardHTML(mk('K♥'))}</div>
          </div>
          <div class="hero-stats">
            <div class="kpi"><span class="k">Lessons passed</span><span class="v">${passed}<small>/${LEVELS.length}</small></span></div>
            <div class="kpi"><span class="k">Overall accuracy</span><span class="v">${acc}</span></div>
            <div class="kpi"><span class="k">Decisions made</span><span class="v">${d.total.n.toLocaleString()}</span></div>
            <div class="kpi"><span class="k">Best drill streak</span><span class="v">${d.bestStreak}</span></div>
          </div>
        </div>
        <div class="page-head" style="margin-bottom:14px"><div><h2 style="font-size:22px">Your path</h2></div></div>
        <div class="levels">${LEVELS.map((l, i) => {
          const p = prog[l.id] || {};
          const cls = p.stars >= 1 ? 'passed' : nextLevel && nextLevel.id === l.id ? 'next' : '';
          return `<button class="level ${cls}" data-id="${l.id}">
            <div class="level-num">${p.stars >= 1 ? '✓' : i + 1}</div>
            <div><h3>${l.title}<span class="level-tag">${l.tag}</span></h3><p>${l.blurb}${p.best != null ? ` · Best ${Math.round(p.best * 100)}%` : ''}</p></div>
            ${stars(p.stars || 0)}
          </button>`;
        }).join('')}</div>`;
      $('#continue', this.root).onclick = () => (nextLevel ? this.openLesson(nextLevel.id) : BJ.App.go('drill', { filter: 'weak' }));
      this.root.querySelector('.levels').onclick = (e) => {
        const b = e.target.closest('.level');
        if (b) this.openLesson(b.dataset.id);
      };
    },
    openLesson(id) {
      this.stopQuiz();
      const l = LEVELS.find((x) => x.id === id);
      if (!l) return this.renderList();
      this.active = l;
      const i = LEVELS.indexOf(l);
      const p = this.progress()[l.id] || {};
      this.root.innerHTML = `
        <div class="lesson-head">
          <button class="btn sm ghost" id="back">← All lessons</button>
          <span class="muted">Lesson ${i + 1} of ${LEVELS.length}</span>
        </div>
        <div class="page-head">
          <div><div class="eyebrow">${l.tag}</div><h1>${l.title}</h1><p>${l.blurb}</p></div>
          <div style="display:flex;gap:12px;align-items:center">${stars(p.stars || 0)}<button class="btn primary lg" id="quiz">Take the quiz (${l.quiz.count} hands)</button></div>
        </div>
        <div class="lesson-grid">${l.lesson().join('')}</div>
        <div style="display:flex;justify-content:center;gap:10px;flex-wrap:wrap">
          <button class="btn primary lg" id="quiz2">I'm ready: start the quiz</button>
        </div>`;
      window.scrollTo({ top: 0 });
      $('#back', this.root).onclick = () => this.renderList();
      $('#quiz', this.root).onclick = $('#quiz2', this.root).onclick = () => this.startQuiz(l);
    },
    startQuiz(l) {
      this.stopQuiz();
      window.scrollTo({ top: 0 });
      this.root.innerHTML = `<div class="lesson-head"><span class="eyebrow" style="margin:0">Quiz · ${l.title}</span></div><div id="quiz-root"></div>`;
      const qroot = $('#quiz-root', this.root);
      const onFinish = (res) => this.showResult(l, res);
      const onExit = () => this.openLesson(l.id);
      if (l.quiz.type === 'totals') this.quiz = new TotalsQuiz(qroot, { count: l.quiz.count, onFinish, onExit });
      else
        this.quiz = new BJ.Trainer(qroot, {
          filter: l.quiz.filter,
          count: l.quiz.count,
          threeCard: !!l.quiz.threeCard,
          das: true,
          source: 'lesson',
          onFinish,
          onExit,
          exitLabel: 'Back to lesson',
        });
      this.quiz.start();
    },
    showResult(l, res) {
      const st = starsFor(res.acc);
      const prog = this.progress();
      const prev = prog[l.id] || {};
      prog[l.id] = { best: Math.max(prev.best || 0, res.acc), stars: Math.max(prev.stars || 0, st) };
      BJ.Stats.save();
      this.stopQuiz();
      const i = LEVELS.indexOf(l);
      const next = LEVELS[i + 1];
      const passed = st >= 1;
      const msg = passed
        ? st === 3
          ? 'Perfect. That section of the chart is yours.'
          : 'Passed. Go for three stars, or move on and come back later.'
        : 'Not quite there yet. Re-read the lesson cards and try again. You need 80% to pass.';
      this.root.innerHTML = BJ.resultsHTML(res, {
        eyebrow: l.title,
        stars: st,
        message: msg,
        buttons: `<button class="btn" id="retry">Try again</button><button class="btn" id="lesson">Review lesson</button>${passed && next ? `<button class="btn primary" id="next">Next: ${next.title} →</button>` : ''}${passed && !next ? `<button class="btn primary" id="table">Take a seat at the table →</button>` : ''}`,
      });
      $('#retry', this.root).onclick = () => this.startQuiz(l);
      $('#lesson', this.root).onclick = () => this.openLesson(l.id);
      if ($('#next', this.root)) $('#next', this.root).onclick = () => this.openLesson(next.id);
      if ($('#table', this.root)) $('#table', this.root).onclick = () => BJ.App.go('table');
      window.scrollTo({ top: 0 });
    },
    stopQuiz() {
      if (this.quiz) this.quiz.destroy();
      this.quiz = null;
    },
    onKey(e) {
      if (this.quiz) this.quiz.onKey(e);
    },
  };

  BJ.LEVELS = LEVELS;
  BJ.LearnView = LearnView;
})(typeof window !== 'undefined' ? window : globalThis);

</script>
  <script>/* js/drill.js */
/* Drill view: endless practice, focus filters, weak-spot mode and 60-second speed rounds. */
(function (G) {
  'use strict';
  const BJ = G.BJ;
  const { $, $$ } = BJ.UI;

  const FOCUS = [
    ['all', 'Everything'],
    ['hard', 'Hard totals'],
    ['soft', 'Soft totals'],
    ['pairs', 'Pairs'],
    ['tough', 'Tough hands'],
    ['weak', 'My weak spots'],
  ];

  const DrillView = {
    init(root) {
      this.root = root;
      this.mode = 'practice';
      this.filter = 'all';
      this.cell = null;
      this.threeCard = true;
      root.innerHTML = `
        <div class="page-head compact">
          <div><div class="eyebrow">Practice</div><h1>Drill</h1>
          <p>Rapid-fire hands. Make the play, get the reason. Keys: <b>H</b> hit · <b>S</b> stand · <b>D</b> double · <b>P</b> split · <b>Enter</b> next.</p></div>
          <div class="seg" data-r="mode"><button data-m="practice" class="on">Practice</button><button data-m="speed">Speed round · 60s</button></div>
        </div>
        <div class="panel drill-panel" style="margin-bottom:16px;display:grid;gap:14px">
          <div style="display:flex;gap:8px;align-items:center">
            <div class="chips" data-r="focus" style="flex:1;min-width:0"></div>
            <button class="chip mobile-only" data-r="optbtn" style="flex:none">Options</button>
          </div>
          <div class="drill-opts" data-r="opts" style="display:flex;gap:14px 20px;flex-wrap:wrap">
            <label class="toggle"><input type="checkbox" data-r="three"> 3-card hands</label>
            <label class="toggle"><input type="checkbox" data-r="das"> Double after split</label>
            <label class="toggle"><input type="checkbox" data-r="auto"> Auto-advance when correct</label>
          </div>
        </div>
        <div data-r="stage"></div>`;
      this.r = (k) => root.querySelector(`[data-r="${k}"]`);
      const s = BJ.Stats.data.settings;
      const bind = (k, get, set) => {
        const i = this.r(k);
        i.checked = get();
        i.addEventListener('change', () => {
          set(i.checked);
          BJ.Stats.save();
          this.restart();
        });
      };
      bind('three', () => this.threeCard, (v) => (this.threeCard = v));
      bind('das', () => s.das, (v) => (s.das = v));
      bind('auto', () => s.autoNext, (v) => (s.autoNext = v));
      this.r('optbtn').addEventListener('click', () => {
        const open = this.r('opts').classList.toggle('open');
        this.r('optbtn').classList.toggle('on', open);
      });
      this.r('mode').addEventListener('click', (e) => {
        const b = e.target.closest('button');
        if (!b) return;
        this.mode = b.dataset.m;
        this.restart();
      });
      this.r('focus').addEventListener('click', (e) => {
        const b = e.target.closest('[data-f]');
        if (!b) return;
        if (b.dataset.f === 'clear-cell') this.cell = null;
        else {
          this.filter = b.dataset.f;
          this.cell = null;
        }
        this.restart();
      });
    },
    onShow(params) {
      if (params && params.cell) {
        this.cell = params.cell;
        this.mode = 'practice';
      }
      if (params && params.filter) {
        this.filter = params.filter;
        this.cell = null;
      }
      if (params || !this.trainer) this.restart();
    },
    onHide() {
      if (this.trainer && this.trainer.speed) this.stop();
    },
    stop() {
      if (this.trainer) this.trainer.destroy();
      this.trainer = null;
    },
    renderFocus() {
      const chips = FOCUS.map(([k, l]) => `<button class="chip ${!this.cell && this.filter === k ? 'on' : ''}" data-f="${k}">${l}</button>`);
      if (this.cell) {
        const c = this.cell;
        chips.unshift(`<button class="chip on" data-f="clear-cell">${BJ.ChartUI.TITLES[c.kind]}: ${BJ.ChartUI.rowLabel(c.kind, c.row)} vs ${BJ.upLabel(c.up)} ✕</button>`);
      }
      this.r('focus').innerHTML = chips.join('');
      $$('button', this.r('mode')).forEach((b) => b.classList.toggle('on', b.dataset.m === this.mode));
    },
    cfg() {
      const s = BJ.Stats.data.settings;
      return { filter: this.filter, cell: this.cell, threeCard: this.threeCard, das: s.das, source: 'drill' };
    },
    restart() {
      this.stop();
      this.renderFocus();
      const stage = this.r('stage');
      if (this.mode === 'speed') {
        const best = BJ.Stats.data.speedBest;
        stage.innerHTML = `<div class="panel result-card">
          <div class="eyebrow">Speed round</div>
          <div class="big">60s</div>
          <p class="muted" style="max-width:46ch">Get as many correct decisions as you can in 60 seconds. A wrong answer shows the right play for a moment, so accuracy beats button-mashing.</p>
          <p>Personal best: <b>${best}</b></p>
          <button class="btn primary lg" data-r="go">Start<kbd>Enter</kbd></button></div>`;
        this.waitingStart = true;
        this.r('go').onclick = () => this.startSpeed();
        return;
      }
      this.waitingStart = false;
      this.trainer = new BJ.Trainer(stage, this.cfg());
      this.trainer.start();
    },
    startSpeed() {
      this.waitingStart = false;
      const stage = this.r('stage');
      this.trainer = new BJ.Trainer(stage, {
        ...this.cfg(),
        timeLimit: 60,
        onFinish: (res) => {
          const prev = BJ.Stats.data.speedBest;
          const record = res.correct > prev;
          if (record) {
            BJ.Stats.data.speedBest = res.correct;
            BJ.Stats.save();
          }
          stage.innerHTML = BJ.resultsHTML(res, {
            eyebrow: record ? 'New personal best!' : 'Speed round',
            bigText: String(res.correct),
            subText: `correct decisions · ${Math.round(res.acc * 100)}% accuracy · best ${Math.max(prev, res.correct)}`,
            buttons: `<button class="btn primary" data-r="again">Go again<kbd>Enter</kbd></button>${res.misses.length ? '<button class="btn" data-r="weak">Drill my weak spots</button>' : ''}`,
          });
          this.trainer = null;
          this.waitingStart = true;
          this.r('again').onclick = () => this.startSpeed();
          if (this.r('weak'))
            this.r('weak').onclick = () => {
              this.mode = 'practice';
              this.filter = 'weak';
              this.restart();
            };
        },
      });
      this.trainer.start();
    },
    onKey(e) {
      if (this.waitingStart && (e.key === 'Enter' || e.key === ' ') && !BJ.UI.ignoreKey(e)) {
        e.preventDefault();
        return this.startSpeed();
      }
      if (this.trainer) this.trainer.onKey(e);
    },
  };

  BJ.DrillView = DrillView;
})(typeof window !== 'undefined' ? window : globalThis);

</script>
  <script>/* js/table.js */
/* Table view: full blackjack rounds against the dealer with a strategy coach. */
(function (G) {
  'use strict';
  const BJ = G.BJ;
  const { $, $$, handHTML, totalBadge, money, signed } = BJ.UI;
  const wait = (ms) => new Promise((r) => setTimeout(r, ms));

  const CHIPS = [
    { v: 5, color: '#c8343f' },
    { v: 25, color: '#1d9a5c' },
    { v: 100, color: '#23272c' },
    { v: 500, color: '#7a3fb8' },
  ];
  const chipColor = (amt) => (amt >= 500 ? '#7a3fb8' : amt >= 100 ? '#23272c' : amt >= 25 ? '#1d9a5c' : '#c8343f');
  const shortAmt = (n) => (n >= 1000 ? (n / 1000).toFixed(n % 1000 ? 1 : 0) + 'k' : String(n));
  const COACH = [
    ['strict', 'Strict', 'Wrong plays are blocked until you make the right one.'],
    ['feedback', 'Feedback', 'Play anything. The coach tells you when you deviate.'],
    ['hints', 'Hints', 'The correct play is highlighted before you act.'],
    ['off', 'Off', 'No help. Your accuracy is still tracked.'],
  ];

  const TableView = {
    init(root) {
      this.root = root;
      const s = BJ.Stats.data;
      this.game = new BJ.TableGame({ bankroll: s.table.bankroll, rules: { das: s.settings.das, surrender: false } });
      this.bet = 0;
      this.lastBet = 25;
      this.seen = new Set();
      this.flip = new Set();
      this.dealerShown = 0;
      this.holeShown = false;
      this.resultsShown = false;
      this.busy = false;
      this.session = { start: this.game.bankroll, n: 0, c: 0, rounds: 0 };
      this.coachMsg = null;
      this.build();
    },
    onShow() {
      this.render();
    },
    build() {
      this.root.innerHTML = `
        <div class="page-head compact">
          <div><div class="eyebrow">Play</div><h1>The Table</h1>
          <p>Real rounds against the dealer: a 6-deck shoe and the rules the strategy chart was built for. The coach checks every decision against basic strategy.</p></div>
        </div>
        <div class="table-layout">
          <div class="table-main">
            <div class="felt table-felt">
              <div class="table-top">
                <div><div class="mobile-only felt-bank" data-r="feltbank"></div><div class="shoe-meter" data-r="shoe"></div></div>
                <div class="seat"><div class="seat-label">Dealer</div><div class="hand" data-r="dealer"></div><span data-r="dtotal"></span></div>
                <div class="shoe-meter" style="justify-self:end;text-align:right" data-r="countmini"></div>
              </div>
              <div style="display:grid;gap:10px;align-content:center">
                <div class="felt-rules" data-r="feltrules"></div>
                <div class="felt-msg" data-r="msg"></div>
                <div class="felt-coach mobile-only" data-r="feltcoach"></div>
              </div>
              <div class="player-hands" data-r="hands"></div>
            </div>
            <div class="controls" style="margin-top:14px">
              <div data-r="betting" class="panel"></div>
              <div data-r="insurance" class="hidden"></div>
              <div data-r="actions" class="hidden"></div>
            </div>
          </div>
          <aside class="side">
            <div class="panel">
              <h4>Bankroll</h4>
              <div class="bankroll" data-r="bankroll"></div>
              <div class="kv"><span>This session</span><b data-r="sessnet"></b></div>
              <div class="kv"><span>Rounds this session</span><b data-r="sessrounds"></b></div>
              <div class="kv"><span>Strategy accuracy (session)</span><b data-r="sessacc"></b></div>
            </div>
            <div class="panel">
              <h4>Coach</h4>
              <div class="seg" data-r="coachmode" style="margin-bottom:10px;flex-wrap:wrap">${COACH.map(([k, l]) => `<button data-k="${k}">${l}</button>`).join('')}</div>
              <p class="muted" style="font-size:13px;margin-bottom:10px" data-r="coachdesc"></p>
              <div class="coach-msg" data-r="coach"></div>
            </div>
            <div class="panel">
              <h4>Card count (Hi-Lo)</h4>
              <label class="toggle" style="margin-bottom:10px"><input type="checkbox" data-r="showcount"> Show the count</label>
              <div class="count-box" data-r="count"></div>
            </div>
            <div class="panel">
              <h4>House rules</h4>
              <div style="display:grid;gap:10px">
                <label class="toggle"><input type="checkbox" data-r="das"> Double after split (DAS)</label>
              </div>
              <p class="muted" style="font-size:13px;margin-top:10px">6 decks · Dealer hits soft 17 · Blackjack pays 3:2 · No surrender · Split to 4 hands · Split Aces get one card. Changes apply from the next hand.</p>
              <button class="btn sm" style="margin-top:12px" data-r="reset">Reset bankroll to $1,000</button>
            </div>
          </aside>
        </div>`;
      this.r = (k) => this.root.querySelector(`[data-r="${k}"]`);
      this.bar = BJ.UI.actionBar(this.r('actions'), (a) => this.play(a));

      const settings = BJ.Stats.data.settings;
      this.r('coachmode').addEventListener('click', (e) => {
        const b = e.target.closest('button');
        if (!b) return;
        settings.coach = b.dataset.k;
        BJ.Stats.save();
        this.coachMsg = null;
        this.render();
      });
      const sc = this.r('showcount');
      sc.checked = settings.showCount;
      sc.addEventListener('change', () => {
        settings.showCount = sc.checked;
        BJ.Stats.save();
        this.renderSide();
      });
      const das = this.r('das');
      das.checked = settings.das;
      das.addEventListener('change', () => {
        settings.das = das.checked;
        BJ.Stats.save();
        BJ.UI.toast(`Double after split ${das.checked ? 'on' : 'off'}: applies from the next hand`);
      });
      this.r('feltcoach').addEventListener('click', () => this.r('coach').scrollIntoView({ behavior: 'smooth', block: 'center' }));
      this.r('reset').addEventListener('click', () => {
        if (this.game.phase === 'player' || this.game.phase === 'insurance' || this.busy) return BJ.UI.toast('Finish this hand first');
        this.game.bankroll = 1000;
        this.session.start = 1000;
        BJ.Stats.data.table.bankroll = 1000;
        BJ.Stats.save();
        this.bet = Math.min(this.bet, 1000);
        this.render();
        BJ.UI.toast('Bankroll reset to $1,000');
      });

      this.r('betting').addEventListener('click', (e) => {
        const chip = e.target.closest('[data-chip]');
        if (chip) return this.addChip(+chip.dataset.chip);
        const act = e.target.closest('[data-do]');
        if (!act) return;
        if (act.dataset.do === 'clear') {
          this.bet = 0;
          this.renderControls();
        }
        if (act.dataset.do === 'deal') this.deal();
      });
      this.r('insurance').addEventListener('click', (e) => {
        const b = e.target.closest('[data-ins]');
        if (b) this.insurance(b.dataset.ins === 'yes');
      });
    },

    get isBetting() {
      const p = this.game.phase;
      return !this.busy && (p === 'betting' || p === 'done');
    },

    addChip(v) {
      if (!this.isBetting) return;
      if (this.bet + v > this.game.bankroll) return BJ.UI.toast('Not enough in your bankroll');
      this.bet += v;
      this.renderControls();
    },

    async deal() {
      if (!this.isBetting) return;
      const g = this.game;
      if (!this.bet) this.bet = Math.min(this.lastBet, g.bankroll);
      if (this.bet < g.rules.minBet) return BJ.UI.toast('Minimum bet is $5');
      if (this.bet > g.bankroll) return BJ.UI.toast('Not enough in your bankroll');
      const s = BJ.Stats.data.settings;
      g.rules.das = s.das;
      g.rules.surrender = false;
      this.lastBet = this.bet;
      g.deal(this.bet);
      if (g.shuffled) BJ.UI.toast('The cut card came out: new shoe shuffled');
      this.coachMsg = null;
      this.dealerShown = 2;
      this.holeShown = false;
      this.resultsShown = false;
      this.flip.clear();
      this.busy = true;
      this.render();
      await wait(450);
      this.busy = false;
      if (g.phase === 'done') await this.reveal();
      else this.render();
    },

    insurance(take) {
      const g = this.game;
      if (g.phase !== 'insurance' || this.busy) return;
      const mode = BJ.Stats.data.settings.coach;
      if (take && mode === 'strict') {
        BJ.Stats.recordInsurance(true);
        this.session.n++;
        this.coachMsg = { ok: false, title: 'Never take insurance', why: insuranceWhy() };
        return this.render();
      }
      BJ.Stats.recordInsurance(take);
      this.session.n++;
      if (!take) this.session.c++;
      this.coachMsg = take
        ? { ok: false, title: 'Basic strategy: never take insurance', why: insuranceWhy() }
        : mode !== 'off'
          ? { ok: true, title: 'Correct: no insurance', why: 'Insurance loses about 7.7% per bet. Decline it every time.' }
          : null;
      g.resolveInsurance(take);
      if (g.phase === 'done') this.reveal();
      else this.render();
    },

    play(a) {
      const g = this.game;
      if (g.phase !== 'player' || this.busy) return;
      const avail = g.available();
      if (!avail[a]) return;
      const rec = BJ.decide(g.hand.cards, g.up.v, g.strategyContext());
      const ok = a === rec.action;
      const mode = BJ.Stats.data.settings.coach;
      BJ.Stats.record(rec, a, 'table');
      this.session.n++;
      if (ok) this.session.c++;
      const exp = BJ.explain(rec);
      if (!ok && mode === 'strict') {
        this.coachMsg = { ok: false, title: `Not quite. Basic strategy says ${BJ.ACTIONS[rec.action].name}.`, why: exp.why, sub: exp.headline, rec };
        this.bar.mark(a, rec.action);
        const felt = this.root.querySelector('.table-felt');
        felt.classList.remove('flash-bad');
        void felt.offsetWidth;
        felt.classList.add('flash-bad');
        this.renderSide();
        return;
      }
      if (mode === 'off') this.coachMsg = null;
      else if (ok) this.coachMsg = { ok: true, title: `Correct: ${BJ.ACTIONS[a].name}`, why: mode === 'hints' ? '' : exp.why, sub: exp.headline };
      else this.coachMsg = { ok: false, title: `Basic strategy says ${BJ.ACTIONS[rec.action].name}`, why: exp.why, sub: `You chose ${BJ.ACTIONS[a].name} · ${exp.headline}`, rec };
      g.act(a);
      if (g.phase === 'done') this.reveal();
      else this.render();
    },

    async reveal() {
      const g = this.game;
      this.busy = true;
      this.render();
      if (!this.holeShown) {
        await wait(350);
        this.holeShown = true;
        this.flip = new Set([g.dealer[1].id]);
        this.render();
        await wait(600);
      }
      while (this.dealerShown < g.dealer.length) {
        this.dealerShown++;
        this.render();
        await wait(620);
      }
      this.resultsShown = true;
      this.busy = false;
      const st = BJ.Stats.data.table;
      st.bankroll = g.bankroll;
      st.rounds++;
      st.net += g.roundNet;
      BJ.Stats.save();
      this.session.rounds++;
      this.bet = Math.min(this.lastBet, Math.floor(g.bankroll));
      if (g.bankroll < g.rules.minBet) this.bet = 0;
      this.render();
    },

    // ---------- rendering ----------
    render() {
      this.renderFelt();
      this.renderControls();
      this.renderSide();
    },

    renderFelt() {
      const g = this.game;
      const rules = BJ.Stats.data.settings;
      this.r('feltrules').textContent = `Blackjack pays 3 to 2 · Dealer hits soft 17 · ${rules.das ? 'Double after split' : 'No double after split'} · Insurance pays 2 to 1`;

      const dCards = g.dealer.slice(0, this.dealerShown);
      this.r('dealer').innerHTML = dCards.length
        ? handHTML(dCards, { hideSecond: !this.holeShown, animate: this.seen, flipIds: this.flip, stagger: 240, delayBase: this.holeShown ? 0 : 120 })
        : `<div class="card back" style="opacity:.12"></div>`;
      this.flip.clear();
      this.r('dtotal').innerHTML = !dCards.length
        ? '<span class="total-badge">Waiting</span>'
        : this.holeShown
          ? totalBadge(dCards, { plain: true })
          : `<span class="total-badge">Shows ${BJ.upLabel(BJ.toUp(g.up.v))}</span>`;

      const handsEl = this.r('hands');
      handsEl.classList.toggle('multi', g.hands.length > 1);
      if (!g.hands.length) {
        handsEl.innerHTML = `<div class="p-hand"><div class="hand"><div class="card back" style="opacity:.12"></div></div><div class="meta"><span class="total-badge">Place a bet to start</span></div></div>`;
      } else {
        handsEl.innerHTML = g.hands
          .map((h, i) => {
            const active = g.phase === 'player' && i === g.active && g.hands.length > 1;
            const dim = g.phase === 'player' && g.hands.length > 1 && i !== g.active;
            const res = this.resultsShown && h.result ? resultTag(h) : '';
            return `<div class="p-hand ${active ? 'active' : ''} ${dim ? 'dim' : ''}">
              <div class="hand">${handHTML(h.cards, { animate: this.seen, stagger: 240 })}</div>
              <div class="meta">${totalBadge(h.cards, { noBJ: h.fromSplit, plain: false })}<span class="bet-chip" style="--chip:${chipColor(h.bet)}">${shortAmt(h.bet)}</span>${h.doubled ? '<span class="result-tag">Doubled</span>' : ''}${res}</div>
            </div>`;
          })
          .join('');
      }
      for (const c of g.dealer.slice(0, this.dealerShown)) this.seen.add(c.id);
      for (const h of g.hands) for (const c of h.cards) this.seen.add(c.id);

      let msg = '';
      if (g.phase === 'insurance') msg = BJ.handInfo(g.hands[0].cards).blackjack ? 'You have blackjack. Dealer shows an Ace.' : 'Dealer shows an Ace';
      else if (g.phase === 'player' && g.hands.length > 1) msg = `Playing hand ${g.active + 1} of ${g.hands.length}`;
      else if (g.phase === 'player') msg = 'Your move';
      else if (this.resultsShown) {
        const n = g.roundNet;
        const dealerBJ = BJ.handInfo(g.dealer).blackjack;
        const notes = [];
        if (dealerBJ) notes.push('Dealer blackjack');
        if (g.insurance) notes.push(dealerBJ ? 'insurance paid 2:1' : `insurance lost ${money(g.insurance)}`);
        const res = n > 0 ? `You win ${money(n)}` : n < 0 ? `You lose ${money(-n)}` : 'Push: you broke even';
        msg = notes.length ? `${notes.join(', ')} · ${res}` : res;
        if (g.bankroll < g.rules.minBet) msg += ' · Out of chips: reset your bankroll';
      } else if (this.busy && this.holeShown) msg = 'Dealer plays';
      this.r('msg').innerHTML = msg ? `<span>${msg}</span>` : '';

      const shoe = g.shoe;
      const used = shoe.pos / shoe.total;
      this.r('shoe').innerHTML = `<span>Shoe · ${shoe.remaining} cards left</span><div class="progress"><span style="width:${(1 - used) * 100}%"></span></div><span class="dim">Cut card at ${Math.round(shoe.penetration * 100)}%</span>`;
    },

    renderControls() {
      const g = this.game;
      const betting = this.isBetting;
      const ins = g.phase === 'insurance' && !this.busy;
      const playing = g.phase === 'player';
      this.r('betting').classList.toggle('hidden', !betting);
      this.r('insurance').classList.toggle('hidden', !ins);
      this.r('actions').classList.toggle('hidden', !playing);

      if (betting) {
        const broke = g.bankroll < g.rules.minBet;
        this.r('betting').innerHTML = broke
          ? `<div class="bet-row" style="flex-direction:column"><b style="font-size:20px">You're out of chips.</b><p class="muted">Variance happens, even with perfect strategy. Reset your bankroll in the House rules panel.</p></div>`
          : `<div class="bet-row">${CHIPS.map((c, i) => `<button class="chip-btn" data-chip="${c.v}" style="--chip:${c.color}" ${c.v > g.bankroll - this.bet ? 'disabled' : ''} title="Add ${money(c.v)} (key ${i + 1})">${c.v}</button>`).join('')}</div>
             <div class="bet-row" style="margin-top:14px">
               <button class="btn sm ghost" data-do="clear" ${this.bet ? '' : 'disabled'}>Clear</button>
               <div class="bet-display"><span class="muted" style="font-size:13px">Bet</span><br><b>${money(this.bet)}</b></div>
               <button class="btn primary lg" data-do="deal" ${this.bet || this.lastBet <= g.bankroll ? '' : 'disabled'}>${this.resultsShown ? 'Deal again' : 'Deal'}<kbd>Enter</kbd></button>
             </div>`;
      }
      if (ins) {
        const bj = BJ.handInfo(g.hands[0].cards).blackjack;
        const cost = g.hands[0].bet / 2;
        this.r('insurance').innerHTML = `<div class="panel insurance-ask"><b>${bj ? 'Even money?' : `Insurance for ${money(cost)}?`}</b>
          <button class="btn primary" data-ins="no">No thanks<kbd>N</kbd></button>
          <button class="btn" data-ins="yes" ${cost > g.bankroll ? 'disabled' : ''}>${bj ? 'Take even money' : 'Take insurance'}<kbd>Y</kbd></button></div>`;
      }
      if (playing) {
        const avail = this.busy ? { H: 0, S: 0, D: 0, P: 0, R: 0 } : g.available();
        this.bar.set(avail);
        this.bar.clearMarks();
        if (BJ.Stats.data.settings.coach === 'hints' && !this.busy) {
          const rec = BJ.decide(g.hand.cards, g.up.v, g.strategyContext());
          this.bar.hint(rec.action);
          const hintKey = `${g.hands.length}:${g.active}:${g.hand.cards.length}`;
          if (!this.coachMsg || this.coachMsg.hintKey !== hintKey) {
            const exp = BJ.explain(rec);
            this.coachMsg = { ok: true, hint: true, hintKey, title: `Coach suggests: ${BJ.ACTIONS[rec.action].name}`, sub: exp.headline, why: exp.why, prev: this.coachMsg && !this.coachMsg.hint ? this.coachMsg : null };
          }
        }
      }
    },

    renderSide() {
      const g = this.game;
      const s = BJ.Stats.data.settings;
      // Until the dealer animation finishes, show the bankroll as it was before payouts.
      const pending = g.phase === 'done' && !this.resultsShown;
      const shown = pending ? g.preSettle : g.bankroll;
      this.r('bankroll').textContent = money(shown);
      const inPlay = g.phase === 'player' || g.phase === 'insurance' || pending ? g.hands.reduce((t, h) => t + h.bet, 0) + g.insurance : 0;
      const net = shown + inPlay - this.session.start;
      const sn = this.r('sessnet');
      sn.textContent = signed(net);
      sn.style.color = net > 0 ? 'var(--green)' : net < 0 ? 'var(--red)' : '';
      this.r('sessrounds').textContent = this.session.rounds;
      this.r('sessacc').textContent = this.session.n ? `${Math.round((this.session.c / this.session.n) * 100)}% (${this.session.c}/${this.session.n})` : '—';

      $$('button', this.r('coachmode')).forEach((b) => b.classList.toggle('on', b.dataset.k === s.coach));
      this.r('coachdesc').textContent = COACH.find((c) => c[0] === s.coach)[2];
      const m = this.coachMsg;
      const coach = this.r('coach');
      if (!m) coach.innerHTML = `<p class="muted" style="font-size:14px">${s.coach === 'off' ? 'Coach is off.' : 'Make a decision and the coach will check it against the chart.'}</p>`;
      else {
        const prev = m.prev ? `<div class="coach-msg ${m.prev.ok ? 'good' : 'bad'}" style="opacity:.7;border-bottom:1px solid var(--line-soft);padding-bottom:8px;margin-bottom:4px"><div class="title">${m.prev.title}</div></div>` : '';
        coach.className = `coach-msg ${m.hint ? '' : m.ok ? 'good' : 'bad'}`;
        coach.innerHTML = `${prev}<div class="title">${m.title}</div>${m.sub ? `<div class="muted" style="font-size:13px">${m.sub}</div>` : ''}${m.why ? `<div>${m.why}</div>` : ''}${m.rec && !m.ok ? BJ.ChartUI.decisionRowsHTML(m.rec) : ''}`;
      }
      // Phones: the coach panel is below the fold, so echo the verdict on the felt (tap it for the reason).
      this.r('feltbank').innerHTML = `<span class="dim" style="font-size:11px;letter-spacing:.12em;text-transform:uppercase">Bankroll</span><br><b style="font-size:18px">${money(shown)}</b>`;
      const fc = this.r('feltcoach');
      if (!m || s.coach === 'off') fc.innerHTML = '';
      else if (m.hint) fc.innerHTML = `<span>💡 ${m.title}</span>`;
      else fc.innerHTML = `<span class="${m.ok ? 'good' : 'bad'}">${m.ok ? '✓' : '✕'} ${m.title}${m.ok ? '' : ' · <u>why?</u>'}</span>`;

      const countEl = this.r('count');
      const mini = this.r('countmini');
      if (s.showCount) {
        const rc = g.visibleCount();
        const decks = Math.max(0.25, g.shoe.remaining / 52);
        const tc = rc / decks;
        countEl.innerHTML = `<div><b>${rc > 0 ? '+' : ''}${rc}</b><span>Running</span></div><div><b>${tc > 0 ? '+' : ''}${tc.toFixed(1)}</b><span>True</span></div><div><b>${decks.toFixed(1)}</b><span>Decks left</span></div>`;
        mini.innerHTML = `<span>Running count</span><b style="font-size:20px;color:#fff">${rc > 0 ? '+' : ''}${rc}</b><span class="dim">True ${tc > 0 ? '+' : ''}${tc.toFixed(1)}</span>`;
      } else {
        countEl.innerHTML = `<p class="muted" style="font-size:13px">Hidden. Practise keeping the count yourself, then switch it on to check. New to counting? Try the Count tab.</p>`;
        mini.innerHTML = '';
      }
    },

    onKey(e) {
      if (BJ.UI.ignoreKey(e)) return;
      const g = this.game;
      const k = e.key.toUpperCase();
      if (g.phase === 'player' && 'HSDP'.includes(k) && k.length === 1) {
        e.preventDefault();
        this.play(k);
      } else if (g.phase === 'insurance' && (k === 'Y' || k === 'N')) {
        e.preventDefault();
        this.insurance(k === 'Y');
      } else if (this.isBetting) {
        if (e.key === 'Enter' || e.key === ' ') {
          e.preventDefault();
          this.deal();
        } else if (/^[1-4]$/.test(e.key)) this.addChip(CHIPS[+e.key - 1].v);
        else if (e.key === 'Backspace' || k === 'C') {
          this.bet = 0;
          this.renderControls();
        }
      }
    },
  };

  function insuranceWhy() {
    return 'Insurance pays 2:1, but only 4 in 13 cards are 10-value. You lose this side bet 9 times out of 13, about −7.7% per bet. Even money is the same bet.';
  }

  function resultTag(h) {
    const map = { win: 'Win', blackjack: 'Blackjack', lose: 'Lose', bust: 'Bust', push: 'Push', surrender: 'Surrendered' };
    const amt = h.net ? ' ' + signed(h.net) : '';
    return `<span class="result-tag ${h.result}">${map[h.result]}${amt}</span>`;
  }

  BJ.TableView = TableView;
})(typeof window !== 'undefined' ? window : globalThis);

/* Count view: Hi-Lo lesson + three counting drills. */
(function (G) {

          <div class="lesson-card tip"><h3><span class="ico">💡</span>Why a high count helps you</h3><ul><li>More blackjacks (paid 3:2 to you, but only 1:1 to the dealer)</li><li>Your doubles on 10 and 11 land more often</li><li>The dealer busts stiff hands more often</li></ul><p class="muted">Counters raise their bets as the true count rises. Counting is legal, but casinos can ask you to stop playing.</p></div>
        </div>
        <h2 style="font-size:22px;margin:8px 0 14px">Drills</h2>
        <div class="lesson-grid">
          <button class="level" data-d="values" style="grid-template-columns:52px 1fr"><div class="level-num">1</div><div><h3>Card values</h3><p>30 cards, as fast as you can: +1, 0 or −1?${BJ.Stats.data.count.valuesBest ? ` · Best ${BJ.Stats.data.count.valuesBest.toFixed(1)}s` : ''}</p></div></button>
          <button class="level" data-d="run" style="grid-template-columns:52px 1fr"><div class="level-num">2</div><div><h3>Running count</h3><p>Cards flash by. Keep the count in your head, then enter it.${BJ.Stats.data.count.runBest ? ` · Best run: ${BJ.Stats.data.count.runBest} cards` : ''}</p></div></button>
          <button class="level" data-d="true" style="grid-template-columns:52px 1fr"><div class="level-num">3</div><div><h3>True count</h3><p>Convert running counts to true counts. 10 questions.</p></div></button>

      this.root.querySelector('.lesson-grid:last-of-type').addEventListener('click', (e) => {
        const b = e.target.closest('[data-d]');

      this.root.querySelector('[data-r="back"]').onclick = () => this.renderHome();

    },

    // ----- Drill 1: card values -----
    values() {
      this.cancel();
      const N = 30;
      const shoe = new BJ.Shoe(1, 1);
      let i = 0;
      let correct = 0;
      let t0 = null;
      let locked = false;
      this.shell(
        'Card values',
        `<div class="trainer"><div class="trainer-bar"><div class="stat-row" data-r="st"></div></div>
         <div class="felt count-stage" data-r="stage"></div>
         <div class="hilo-keys" style="margin:0 auto">
           <button class="act act-D" data-v="1">+1<small>← or 1</small></button>
           <button class="act act-H" data-v="0">0<small>↓ or 0</small></button>
           <button class="act act-R" data-v="-1">−1<small>→ or −</small></button>
         </div></div>`
      );
      const stage = this.root.querySelector('[data-r="stage"]');
      const st = this.root.querySelector('[data-r="st"]');
      let card;
      const show = () => {
        card = shoe.draw();
        stage.innerHTML = handHTML([card], { animate: true });
        st.innerHTML = `<span class="stat-pill">Card <b>${i + 1}</b>/${N}</span><span class="stat-pill">Correct <b>${correct}</b></span>`;
      };
      const answer = async (v) => {
        if (locked || i >= N) return;
        if (t0 === null) t0 = performance.now();
        const ok = v === BJ.hiLo(card);
        i++;
        if (ok) correct++;
        else {
          locked = true;
          stage.insertAdjacentHTML('beforeend', `<div class="ctx-note">${card.rank} counts ${fmt(BJ.hiLo(card))}</div>`);
          const tok = this.token;
          await wait(900);
          if (tok !== this.token) return;
          locked = false;
        }
        if (i >= N) return done();
        show();
      };
      const done = () => {
        const secs = (performance.now() - t0) / 1000;
        const acc = correct / N;
        const c = BJ.Stats.data.count;
        let note = '';
        if (acc >= 0.9 && (!c.valuesBest || secs < c.valuesBest)) {
          c.valuesBest = secs;
          BJ.Stats.save();
          note = 'New best time!';
        }
        this.keyHandler = (e) => {
          if (e.key === 'Enter') this.values();

        this.root.querySelector('.trainer').innerHTML = BJ.resultsHTML(
          { n: N, correct, acc, misses: [] },
          {
            eyebrow: note || 'Card values',
            bigText: secs.toFixed(1) + 's',
            subText: `${correct}/${N} correct · ${(secs / N).toFixed(2)}s per card`,
            message: acc < 0.9 ? 'Aim for 90%+ accuracy before speed. Best times only count at 90%+.' : 'Strong counters tag a card in well under half a second.',
            buttons: `<button class="btn primary" data-r="again">Again<kbd>Enter</kbd></button><button class="btn" data-r="home">Back</button>`,
          }
        );
        this.root.querySelector('[data-r="again"]').onclick = () => this.values();
        this.root.querySelector('[data-r="home"]').onclick = () => this.renderHome();
      };
      this.root.querySelector('.hilo-keys').onclick = (e) => {
        const b = e.target.closest('[data-v]');
        if (b) answer(+b.dataset.v);
      };
      this.keyHandler = (e) => {
        const map = { ArrowLeft: 1, '1': 1, ArrowDown: 0, '0': 0, ArrowRight: -1, '-': -1 };
        if (e.key in map) {
          e.preventDefault();
          answer(map[e.key]);
        }
      };
      show();
    },

    // ----- Drill 2: running count -----
    runSetup() {
      this.cancel();
      this.runOpts = this.runOpts || { n: 20, ms: 900 };
      const o = this.runOpts;
      const seg = (name, opts, cur) => `<div class="seg" data-g="${name}">${opts.map(([v, l]) => `<button data-v="${v}" class="${v === cur ? 'on' : ''}">${l}</button>`).join('')}</div>`;
      this.shell(
        'Running count',
        `<div class="panel result-card">
          <div class="big" style="font-size:44px">Keep the count</div>
          <p class="muted" style="max-width:48ch">Cards appear one at a time. Keep the Hi-Lo running count in your head, then type it in at the end.</p>
          <div style="display:grid;gap:12px;justify-items:center">
            <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:center"><span class="muted">Cards</span>${seg('n', [[10, '10'], [20, '20'], [52, 'Full deck']], o.n)}</div>
            <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:center"><span class="muted">Speed</span>${seg('ms', [[1400, 'Slow'], [900, 'Medium'], [550, 'Fast'], [350, 'Casino']], o.ms)}</div>
          </div>
          <button class="btn primary lg" data-r="go">Start<kbd>Enter</kbd></button>
        </div>`
      );
      this.root.querySelectorAll('[data-g]').forEach((g) =>
        g.addEventListener('click', (e) => {
          const b = e.target.closest('button');
          if (!b) return;
          o[g.dataset.g] = +b.dataset.v;
          $$('button', g).forEach((x) => x.classList.toggle('on', x === b));

      this.cancel();
      const tok = this.token;
      const { n, ms } = this.runOpts;
      const shoe = new BJ.Shoe(1, 1);

      this.shell('Running count', `<div class="trainer"><div class="felt count-stage" data-r="stage"></div><div class="progress"><span data-r="p" style="width:0"></span></div></div>`);
      const stage = this.root.querySelector('[data-r="stage"]');
      const p = this.root.querySelector('[data-r="p"]');
      stage.innerHTML = `<div class="big" style="font-size:42px;font-weight:800">Ready…</div>`;
      await wait(900);
      for (let i = 0; i < n; i++) {
        if (tok !== this.token) return;
        const c = shoe.draw();

        p.style.width = ((i + 1) / n) * 100 + '%';

        </div>`;
        this.root.querySelector('[data-r="again"]').onclick = () => this.run();
        this.root.querySelector('[data-r="setup"]').onclick = () => this.runSetup();
        this.keyHandler = (ev) => {
          if (ev.key === 'Enter') this.run();
        };
      };
    },

    // ----- Drill 3: true count -----
    trueCount() {
      this.cancel();
      const N = 10;
      let i = 0;
      let correct = 0;
      const decksList = [1, 1.5, 2, 2.5, 3, 3.5, 4, 4.5, 5];
      const roundSym = (x) => Math.sign(x) * Math.round(Math.abs(x));
      this.shell('True count', `<div class="trainer" data-r="t"></div>`);
      const box = this.root.querySelector('[data-r="t"]');
      const ask = () => {
        if (i >= N) {
          box.innerHTML = BJ.resultsHTML(
            { n: N, correct, acc: correct / N, misses: [] },
            { eyebrow: 'True count', buttons: `<button class="btn primary" data-r="again">Again</button><button class="btn" data-r="home">Back</button>` }
          );
          box.querySelector('[data-r="again"]').onclick = () => this.trueCount();
          box.querySelector('[data-r="home"]').onclick = () => this.renderHome();
          return;
        }
        let rc, decks, exact;
        do {
          rc = BJ.rand(25) - 12;
          decks = BJ.pick(decksList);
          exact = rc / decks;
        } while (rc === 0 || Math.abs(Math.abs(exact % 1) - 0.5) < 0.05);
        const ans = roundSym(exact);
        const opts = new Set([ans]);
        for (const d of BJ.pick([[-1, 1, 2], [-2, -1, 1], [1, 2, 3], [-1, -2, -3]])) opts.add(ans + d);
        const list = Array.from(opts).sort((a, b) => a - b);
        box.innerHTML = `<div class="trainer-bar"><div class="stat-row"><span class="stat-pill">Question <b>${i + 1}</b>/${N}</span><span class="stat-pill">Correct <b>${correct}</b></span></div></div>
          <div class="felt count-stage" style="min-height:220px"><div style="text-align:center;display:grid;gap:10px">
            <div class="seat-label">Running count</div><div style="font-size:54px;font-weight:800;line-height:1">${fmt(rc)}</div>
            <div class="seat-label" style="margin-top:8px">Decks left to play</div><div style="font-size:34px;font-weight:700;line-height:1">${decks}</div>
          </div></div>
          <p class="muted" style="text-align:center">True count = running ÷ decks left. Round to the nearest whole number.</p>
          <div class="choice-grid" style="grid-template-columns:repeat(4,1fr)">${list.map((v) => `<button class="choice" data-v="${v}">${fmt(v)}</button>`).join('')}</div>
          <div data-r="fb"></div>`;
        box.querySelector('.choice-grid').onclick = (e) => {
          const b = e.target.closest('.choice');
          if (!b || b.disabled) return;
          const ok = +b.dataset.v === ans;
          if (ok) correct++;
          i++;
          $$('.choice', box).forEach((x) => {
            x.disabled = true;
            if (+x.dataset.v === ans) x.classList.add('right');
            else if (x === b) x.classList.add('wrong');
          });
          box.querySelector('[data-r="fb"]').innerHTML = `<div class="feedback ${ok ? '' : 'bad'}"><div class="fb-head"><div class="fb-icon">${ok ? '✓' : '✕'}</div><div><div class="fb-title">${fmt(rc)} ÷ ${decks} = ${exact.toFixed(2)} → true count ${fmt(ans)}</div></div></div><div class="fb-foot"><span></span><button class="btn primary" data-r="next">Next<kbd>Enter</kbd></button></div></div>`;
          box.querySelector('[data-r="next"]').onclick = ask;
          this.keyHandler = (ev) => {
            if (ev.key === 'Enter' || ev.key === ' ') {
              ev.preventDefault();
              this.keyHandler = null;
              ask();
            }
          };
        };
        this.keyHandler = null;
      };
      ask();
    },

    onKey(e) {
      if (this.keyHandler && !(e.target && e.target.tagName === 'INPUT')) this.keyHandler(e);
    },
  };

  BJ.CountView = CountView;
})(typeof window !== 'undefined' ? window : globalThis);

/* Progress view: accuracy by section, most-missed hands, recent mistakes. */
(function (G) {
  'use strict';
  const BJ = G.BJ;
  const { $, handHTML, pct, money, signed } = BJ.UI;

  const SECTIONS = [
    ['hard', 'Hard totals'],
    ['soft', 'Soft totals'],
    ['pairs', 'Pairs'],
    ['insurance', 'Insurance'],
  ];

  const ProgressView = {
    init(root) {
      this.root = root;
    },
    onShow() {
      this.render();
    },
    render() {
      const d = BJ.Stats.data;
      const acc = BJ.Stats.acc(d.total);
      const passed = BJ.LEVELS.filter((l) => (d.levels[l.id] || {}).stars >= 1).length;
      const bars = SECTIONS.map(([k, label]) => {
        const s = d.tables[k];
        const a = BJ.Stats.acc(s);
        const color = a == null ? 'var(--panel-3)' : a >= 0.95 ? 'var(--green)' : a >= 0.8 ? 'var(--yellow)' : 'var(--red)';
        return `<div class="cat-bar"><span>${label}</span><div class="progress"><span style="width:${a == null ? 0 : a * 100}%;background:${color}"></span></div><b style="text-align:right">${pct(a)}<span class="dim" style="font-weight:400;font-size:12px"> ${s ? s.n : 0}</span></b></div>`;
      }).join('');

      // Most-missed cells
      const cells = Object.entries(d.cells)
        .map(([key, s]) => ({ key, ...s, miss: s.n - s.c }))
        .filter((x) => x.miss > 0 && BJ.ChartUI.TITLES[x.key.split(':')[0]])
        .sort((a, b) => b.miss - a.miss || a.c / a.n - b.c / b.n)
        .slice(0, 8);
      const missRows = cells
        .map((x) => {
          const [kind, row, up] = x.key.split(':');
          const r = +row;
          const u = +up;
          if (!BJ.ChartUI.TITLES[kind] || (kind === 'soft' && (r < 13 || r > 20))) return '';
          const cards = BJ.ChartUI.exampleCards(kind, r);
          const rec = BJ.decide(cards, u === 11 ? 1 : u, { canDouble: true, canSplit: true, canSurrender: false, das: d.settings.das });
          return `<div class="miss">
            <div><b>${BJ.ChartUI.rowLabel(kind, r)}</b> <span class="muted">vs</span> <b>${BJ.upLabel(u)}</b><div class="muted" style="font-size:12px">${BJ.ChartUI.TITLES[kind]}</div></div>
            <div class="muted" style="font-size:13px">${x.c}/${x.n} correct · missed ${x.miss}×</div>
            <div style="display:flex;gap:8px;align-items:center">${BJ.UI.actionTag(rec.action)}<button class="btn sm" data-cell="${x.key}">Drill</button></div>
          </div>`;
        })
        .join('');

      const recent = d.mistakes
        .slice(0, 8)
        .map((m) => {
          const cards = m.cards.map(([r, s]) => BJ.makeCard(r, s));
          return `<div class="miss"><div class="mini-hand">${handHTML(cards)}</div>
            <div>${BJ.describeHand(cards)} vs <b>${BJ.upLabel(m.up)}</b><div class="muted" style="font-size:12px">You chose ${BJ.ACTIONS[m.chosen].name} · ${m.source || 'drill'}</div></div>
            ${BJ.UI.actionTag(m.best)}</div>`;
        })
        .join('');

      const t = d.table;
      this.root.innerHTML = `
        <div class="page-head">
          <div><div class="eyebrow">Your progress</div><h1>Progress</h1><p>Every decision you make in lessons, drills and at the table is tracked here, down to the single chart cell.</p></div>
          <div style="display:flex;gap:10px;flex-wrap:wrap"><button class="btn primary" data-go="weak">Drill my weak spots</button><button class="btn" data-go="heat">See accuracy heatmap</button></div>
        </div>
        <div class="stats-grid">
          <div class="kpi"><span class="k">Decisions</span><span class="v">${d.total.n.toLocaleString()}</span></div>
          <div class="kpi"><span class="k">Accuracy</span><span class="v">${pct(acc)}</span></div>
          <div class="kpi"><span class="k">Lessons passed</span><span class="v">${passed}<small>/${BJ.LEVELS.length}</small></span></div>
          <div class="kpi"><span class="k">Best streak · speed</span><span class="v">${d.bestStreak}<small> · ${d.speedBest}</small></span></div>
        </div>
        <div class="two-col">
          <div style="display:grid;gap:18px">
            <div class="panel"><h4 class="eyebrow" style="color:var(--muted)">Accuracy by chart section</h4><div class="cat-bars">${bars}</div></div>
            <div class="panel"><h4 class="eyebrow" style="color:var(--muted)">At the table</h4>
              <div class="kv"><span>Bankroll</span><b>${money(t.bankroll)}</b></div>
              <div class="kv"><span>Rounds played</span><b>${t.rounds.toLocaleString()}</b></div>
              <div class="kv"><span>All-time result</span><b style="color:${t.net > 0 ? 'var(--green)' : t.net < 0 ? 'var(--red)' : ''}">${signed(t.net)}</b></div>
              <div class="kv"><span>Strategy accuracy at the table</span><b>${pct(BJ.Stats.acc(t))}</b></div>
              <p class="muted" style="font-size:13px;margin-top:8px">Short-term results swing a lot, even with perfect play. Judge yourself on accuracy, not on wins.</p>
            </div>
          </div>
          <div style="display:grid;gap:18px">
            <div class="panel"><h4 class="eyebrow" style="color:var(--muted)">Most-missed hands</h4><div class="miss-list" style="max-width:none">${missRows || '<p class="muted">No misses yet. Go make some decisions!</p>'}</div></div>
            <div class="panel"><h4 class="eyebrow" style="color:var(--muted)">Recent mistakes</h4><div class="miss-list" style="max-width:none">${recent || '<p class="muted">Nothing here yet.</p>'}</div></div>
          </div>
        </div>
        <div style="margin-top:28px;text-align:center"><button class="btn sm ghost" data-go="reset">Reset all progress</button></div>`;

      this.root.onclick = (e) => {
        const c = e.target.closest('[data-cell]');
        if (c) {
          const [kind, row, up] = c.dataset.cell.split(':');
          return BJ.App.go('drill', { cell: { kind, row: +row, up: +up } });
        }
        const g = e.target.closest('[data-go]');
        if (!g) return;
        if (g.dataset.go === 'weak') BJ.App.go('drill', { filter: 'weak' });
        if (g.dataset.go === 'heat') {
          BJ.ChartView.mode = 'heat';
          BJ.App.go('chart');
        }
        if (g.dataset.go === 'reset' && confirm('Reset all lessons, stats and your bankroll? This cannot be undone.')) {
          BJ.Stats.reset();
          if (BJ.TableView.game) {
            BJ.TableView.game.bankroll = 1000;
            BJ.TableView.session.start = 1000;
          }
          this.render();
          BJ.UI.toast('Progress reset');
        }
      };
    },
  };

  BJ.ProgressView = ProgressView;
})(typeof window !== 'undefined' ? window : globalThis);

</script>
  <script>/* js/app.js */
/* Router: hash-based views, keyboard dispatch. */
(function (G) {
  'use strict';
  const BJ = G.BJ;

  const VIEWS = {
    learn: BJ.LearnView,
    drill: BJ.DrillView,
    table: BJ.TableView,
    chart: BJ.ChartView,
    count: BJ.CountView,
    progress: BJ.ProgressView,
  };
  const inited = new Set();
  let current = null;
  let pendingParams = null;

  function show(name, params) {
    if (!VIEWS[name]) name = 'learn';
    const view = VIEWS[name];
    if (current && current !== name && VIEWS[current].onHide) VIEWS[current].onHide();
    document.querySelectorAll('.view').forEach((v) => v.classList.toggle('active', v.id === 'view-' + name));
    document.querySelectorAll('.tabs a').forEach((a) => a.classList.toggle('active', a.dataset.view === name));
    const root = document.getElementById('view-' + name);
    if (!inited.has(name)) {
      view.init(root);
      inited.add(name);
    }
    const changed = current !== name;
    current = name;
    if (view.onShow) view.onShow(params || null);
    if (changed) window.scrollTo({ top: 0 });
  }

  function route() {
    const name = (location.hash || '#learn').slice(1);
    const params = pendingParams;
    pendingParams = null;
    show(name, params);
  }

  BJ.App = {
    go(name, params) {
      pendingParams = params || null;
      if (location.hash === '#' + name) route();
      else location.hash = name;
    },
  };

  // Clicking the active tab returns that view to its start (e.g. the lesson list).
  document.querySelector('.tabs').addEventListener('click', (e) => {
    const a = e.target.closest('a[data-view]');
    if (a && a.dataset.view === current && current === 'learn') BJ.LearnView.renderList();
    if (a && a.dataset.view === current && current === 'count') BJ.CountView.renderHome();
  });

  document.addEventListener('keydown', (e) => {
    const v = current && VIEWS[current];
    if (v && v.onKey) v.onKey(e);
  });

  window.addEventListener('hashchange', route);
  route();

  // Offline support for the hosted (https) version. Skipped for local files and local testing.
  if ('serviceWorker' in navigator && location.protocol === 'https:') {
    window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
  }
})(window);

</script>
